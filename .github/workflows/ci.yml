name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend quality and real browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend used by API generation and E2E
        run: python -m pip install --disable-pip-version-check -e "..[dev]"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Verify generated OpenAPI client is current
        run: npm run api:check

      - name: Run frontend static checks
        run: |
          npm run typecheck
          npm run lint
          npm run format:check

      - name: Run frontend unit and component tests
        run: npm run test

      - name: Build production frontend
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run real browser-to-FastAPI E2E
        run: npm run test:e2e

  quality-gates:
    name: Python 3.11 quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: "sqlite:///:memory:"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run Mypy
        run: mypy

      - name: Run unit tests
        run: >-
          pytest tests/unit
          --cov=copilot
          --cov-report=term-missing
          --cov-report=xml

      - name: Run integration, contract, and smoke tests
        run: pytest tests/integration tests/contract tests/smoke

      - name: Run security regression tests
        run: pytest tests/security

      - name: Run MCP 2025-11-25 contract and unit gates
        run: pytest tests/unit/mcp tests/contract/mcp

      - name: Run real hermetic MCP client/server integration and smoke gates
        run: pytest tests/integration/mcp tests/smoke/mcp

      - name: Run MCP security gates
        run: pytest tests/security/mcp

      - name: Run MCP interoperability and safety evaluation
        run: python evaluation/run_mcp_eval.py --output evaluation/reports/mcp-ci.json

      - name: Run offline Agent evaluation regression gate
        run: >-
          python evaluation/run_eval.py
          --mode mock
          --seed 42
          --baseline evaluation/baselines/supplier_quality_v1.json
          --fail-on-regression

      - name: Upload offline Agent evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evaluation-reports
          path: evaluation/reports/

      - name: Check documentation governance
        run: python scripts/check_docs.py

      - name: Check architecture dependencies
        run: python scripts/check_architecture.py

      - name: Verify editable install and distribution build
        run: |
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m build
          python -m pip install --disable-pip-version-check --no-deps --force-reinstall dist/*.whl
          python -c "import copilot; print(copilot.__version__)"

  postgres-integration:
    name: PostgreSQL migration and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: copilot_test
          POSTGRES_USER: copilot_test
          POSTGRES_PASSWORD: copilot_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot_test -d copilot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      business-postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: business_test
          POSTGRES_USER: business_test
          POSTGRES_PASSWORD: business_test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U business_test -d business_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: "sqlite:///:memory:"
      PERSISTENCE_DATABASE_URL: "postgresql+psycopg://copilot_test:copilot_test_password@127.0.0.1:5432/copilot_test"
      TEST_POSTGRES_URL: "postgresql+psycopg://copilot_test:copilot_test_password@127.0.0.1:5432/copilot_test"
      TEST_BUSINESS_POSTGRES_URL: "postgresql+psycopg://business_test:business_test_password@127.0.0.1:5433/business_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run PostgreSQL integration test
        run: pytest tests/integration/test_postgres_persistence.py -v
      - name: Run PostgreSQL business migration and seed tests
        run: pytest tests/integration/test_postgres_business_database.py -v

  container-build:
    name: Container and Compose build gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose topology
        env:
          RAG_IMAGE: enterprise-rag-engine:ci-placeholder
        run: docker compose config
      - name: Validate production Compose topology
        env:
          COPILOT_IMAGE: enterprise-copilot:ci
          FRONTEND_IMAGE: enterprise-copilot-frontend:ci
          RAG_IMAGE: enterprise-rag-engine:ci-placeholder
          POSTGRES_DB: copilot
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: ci-only-placeholder
          PERSISTENCE_DATABASE_URL: postgresql+psycopg://copilot:ci-only-placeholder@postgres/copilot
          DATABASE_URL: postgresql+psycopg://readonly:ci-only-placeholder@business-db/quality
          LLM_API_KEY: ci-only-placeholder
          IDENTITY_SIGNING_SECRET: ci-only-identity-signing-secret-32-bytes
        run: docker compose -f docker-compose.production.yml config
      - name: Validate Local Enterprise Compose topology
        env:
          ENTERPRISE_RAG_IMAGE: enterprise-rag-engine:ci-placeholder
          COPILOT_LLM_PROVIDER: mock
        run: >-
          docker compose
          --env-file .env.local-enterprise.example
          -f docker-compose.local-enterprise.yml
          config
      - name: Build Copilot image
        run: docker build --tag enterprise-copilot:ci .
      - name: Build frontend image
        run: docker build --tag enterprise-copilot-frontend:ci frontend
