[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-enterprise-knowledge-copilot"
version = "0.1.0"
description = "Governed, evidence-backed enterprise task completion foundation."
requires-python = ">=3.11"
authors = [
    { name = "Agentic Enterprise Knowledge Copilot Contributors" },
]
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "jsonschema>=4.23,<5.0",
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-sqlite>=3.1,<4.0",
    "langgraph-checkpoint-postgres>=3.1,<4.0",
    "mcp>=1.29,<2.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "reportlab>=4.4,<5.0",
    "sqlalchemy>=2.0,<3.0",
    "typer>=0.15,<1.0",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2.0",
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff==0.16.4",
    "types-jsonschema>=4.23,<5.0",
    "types-reportlab>=4.4,<5.0",
]

[project.scripts]
enterprise-copilot = "copilot.bootstrap.cli:app"
enterprise-copilot-rag-warmup = "copilot.bootstrap.knowledge_cli:warmup_entrypoint"
enterprise-copilot-publish-ap-policy = "copilot.bootstrap.policy_cli:policy_publish_entrypoint"
enterprise-copilot-worker = "copilot.bootstrap.worker:main"
enterprise-copilot-inspect-runtime = "copilot.bootstrap.runtime_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["copilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-config --strict-markers"
markers = [
    "integration: exercises boundaries between composed local components",
    "live_rag: calls an explicitly enabled live Enterprise RAG Engine",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts", "evaluation", "tests"]
